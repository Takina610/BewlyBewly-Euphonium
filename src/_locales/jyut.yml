    開咗呢個功能嘅話，你 Follow 緊嘅人唔會俾啲過濾條件限制。
  filter_out_vertical_videos: 避開啲打戙嘅片（淨係得 app 推介模式下有效）
  filter_by_view_count: 根據觀看次數篩選
  filter_by_view_count_desc: 避開啲觀看次數唔夠你設嗰個數嘅片。
  filter_by_view_count_unit: 次
  filter_by_duration: 根據條片長度篩選
  filter_by_duration_desc: 避開啲片長唔夠你設嗰個時間嘅片。
  filter_by_duration_unit: 秒
  filter_item_already_exist: 呢個篩選條件已經有咗喇！
  filter_by_title: 根據標題篩選
  filter_by_title_desc: |-
    避開啲標題係你指定嘅字嘅片（唔理大細楷），抑或用正則表達式，好似 <code>/abc&#124;\d+/</code> 噉，用兩個 <code>/</code> 包住。
    <br/>
    喺下低個表度，撳 <kbd>Enter</kbd> 就可以加新嘅篩選條件，抑或確定你上先改咗嘅嘢。
    撳 <kbd>Esc</kbd> 就取消你改咗嘅嘢。
    撳兩吓欄位就可以改返入邊嘅嘢。
  filter_by_user: 根據用戶篩選
  filter_by_user_desc: |-
    避開啲 po 片嗰位係你指定嘅用戶名（全名，唔理大細楷）抑或 MID 嘅片，抑或用正則表達式，好似 <code>/abc&#124;\d+/</code> 噉，用兩個 <code>/</code> 包住。
    <br/>
    喺下低個表度，撳 <kbd>Enter</kbd> 就可以加新嘅篩選條件，抑或確定你上先改咗嘅嘢。
    撳 <kbd>Esc</kbd> 就取消你改咗嘅嘢。
    撳兩吓欄位就可以改返入邊嘅嘢。
  filter_by_user_table:
    username_or_mid: 用戶名 / MID

