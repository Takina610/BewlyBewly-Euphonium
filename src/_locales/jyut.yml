    access key。
  authorize_app_more_info_access_key: 關於 access key
  scan_qrcode_desc: 用 bilibili 流動應用程式去 scan 呢個 QR code 愛嚟授權取得 access key。

  disable_filters_for_followed_users: Follow 緊嘅人唔受啲過濾條件限制
