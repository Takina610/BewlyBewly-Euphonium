  always_show_tabs_on_home_page: 永遠顯示主頁分頁欄

  # Compatibility
  # Common
  topbar_visibility: BewlyBewly 頂部欄可視性
  topbar_visibility_desc: 若然你係用緊 Bilibili Evolved 嘅頂部欄，你可以喺度閂咗 BewlyBewly 嘅頂部欄去。
  use_original_bilibili_homepage: 用返原本嘅 bilibili 主頁
  use_original_bilibili_homepage_desc: 改咗之後，如果你喺主頁，個頁面就會自動重新整理！
  use_original_bilibili_topbar: 用返原本嘅 bilibili 頂部欄
  adapt_to_other_page_styles: 適應其他版面風格
  adapt_to_other_page_styles_desc: 執執啲常用嘅版面，襯返 BewlyBewly 主題風格。
  # Bilibili Evolved
  follow_bilibili_evolved_color: 跟返 Bilibili Evolved 主題色
  follow_bilibili_evolved_color_desc: 每次換完 Bilibili Evolved 主題色嗰陣，記得揀多一次呢個選項愛嚟更新佈置。

  # 摸魚模式
  slacking_mode: 摸魚模式
  slacking_mode_desc: >
    成版變暗、收埋背景圖、閂咗毛玻璃、封面灰化、閂咗懸停預覽同收埋彈幕。你嘅主題配色唔會被改動。
  slacking_level: 偽裝級別
  slacking_level_opt:
    light: 輕偽裝
    heavy: 重偽裝
  slacking_level_desc: >
    輕偽裝保持所有排版原樣。重偽裝喺上面再將卡片牆壓成緊湊清單，同埋幫條片冚一層灰，令畫面上冇嘢高飽和、亦都冇影片網站嘅形狀。
  slacking_level_shortcut: 重偽裝快捷鍵
  slacking_level_shortcut_desc: >
    㩒一下直接入重偽裝（模式未開嘅話會順便開埋）。再㩒一下返去輕偽裝。
  slacking_dim_intensity: 加暗強度
  slacking_dim_intensity_desc: >
    開住嗰陣版嘢變暗嘅程度，絕大部分嘅「唔覺眼」都係靠佢做到——版嘢嘅配色同排版都原樣保留，淨係暗咗。
  slacking_video_dim_intensity: 影片灰化強度
  slacking_video_dim_intensity_desc: >
    重偽裝嗰陣冚喺播放器上面層灰有幾重。播緊嘅鮮豔畫面係「你喺度做乜」最強嘅證據，灰咗佢先至令條片唔再搶眼。播放器同控件都保持原位唔郁。
  slacking_notice_title: 摸魚模式開咗喇
  slacking_notice_desc: >
    佢會接管背景圖同主題色漸變底色，所以開住嗰陣呢一版被成版收埋咗（你嘅設定都仲喺度）。想改版面，閂咗摸魚模式先。
  slacking_notice_desc_search_page: >
    佢會收埋所有背景圖，所以開住嗰陣呢一版被成版收埋咗（你嘅設定都仲喺度）。想改搵嘢頁嘅版面，閂咗摸魚模式先。
  slacking_notice_desc_performance: >
    佢照設計會閂咗毛玻璃，所以呢兩項暫時收埋咗。「閂咗陰影」唔受影響，仲可以設定。
  slacking_notice_desc_video_page: >
