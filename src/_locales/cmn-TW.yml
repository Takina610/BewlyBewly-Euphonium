  # Compatibility
  # Common
  topbar_visibility: 頂欄可視性
  topbar_visibility_desc: 如果你正在使用 Bilibili Evolved 的頂欄，你可以在這裡關閉 BewlyBewly 的頂欄。
  use_original_bilibili_homepage: 使用原版 bilibili 首頁
  use_original_bilibili_homepage_desc: 當您變更此設定後，如果在首頁上，頁面將自動重新整理！
  use_original_bilibili_topbar: 使用原版 bilibili 頂欄
  adapt_to_other_page_styles: 適應其他頁面風格
  adapt_to_other_page_styles_desc: 適應一些常見頁面，以配合 BewlyBewly 主題。
  # Bilibili Evolved
  follow_bilibili_evolved_color: 使用 Bilibili Evolved 主題色
  follow_bilibili_evolved_color_desc: 每次變更 Bilibili Evolved 主題色後，記得重新選取此選項以更新配置。

  # 摸魚模式
  slacking_mode: 摸魚模式
  slacking_mode_desc: >
    整頁變暗、隱藏背景圖片、關掉毛玻璃、封面灰化、關掉懸停預覽並隱藏彈幕。你的主題配色不會被改動。
  slacking_level: 偽裝級別
  slacking_level_opt:
    light: 輕偽裝
    heavy: 重偽裝
  slacking_level_desc: >
    輕偽裝保持所有佈局原樣。重偽裝在此之上把卡片牆壓成緊湊列表，並給影片本體蓋一層灰，讓畫面上不留任何高飽和的東西、也不留影片網站的形狀。
  slacking_level_shortcut: 重偽裝快速鍵
  slacking_level_shortcut_desc: >
    按下直接進入重偽裝（模式沒開時會一併開啓）。再按一次回到輕偽裝。
  slacking_dim_intensity: 加暗強度
  slacking_dim_intensity_desc: >
    開啓期間頁面變暗的程度，絕大部分的「不顯眼」都是靠它做到的——頁面的配色和佈局都原樣保留，只是變暗了。
  slacking_video_dim_intensity: 影片灰化強度
  slacking_video_dim_intensity_desc: >
    重偽裝時蓋在播放器上的灰有多重。正在播放的鮮豔畫面是「你在幹什麼」最強的證據，把它灰掉才能讓影片不再搶眼。播放器和控件都保持原位不動。
  slacking_notice_title: 摸魚模式已開啓
  slacking_notice_desc: >
    它會接管背景圖片和主題色漸層背景，所以開啓期間這一頁被整個隱藏了（你的設定都還保留著）。想改外觀，先把摸魚模式關掉。
  slacking_notice_desc_search_page: >
    它會隱藏所有背景圖片，所以開啓期間這一頁被整個隱藏了（你的設定都還保留著）。想改搜尋頁的外觀，先把摸魚模式關掉。
  slacking_notice_desc_performance: >
    它按設計會把毛玻璃關掉，所以這兩項暫時隱藏了。「停用陰影」不受影響，仍然可以設定。
  slacking_notice_desc_video_page: >
    它會隱藏影片頁背景，所以開啓期間這一頁被整個隱藏了（你的設定都還保留著）。想改影片頁的外觀，先把摸魚模式關掉。
  slacking_notice_disable: 關閉摸魚模式
  slacking_notice_configure: 摸魚模式設定
  slacking_disguise_title: 偽裝分頁標題和圖示
  slacking_disguise_title_desc: >
    把分頁標題和 favicon 換成一個像工作內容的名字。不開這個的話，分頁欄、工作列懸停預覽和 Alt-Tab 裡都還寫著 bilibili。
  slacking_window_title: 標題文字
  slacking_window_title_default: 資料分析日報
  slacking_window_title_desc: >
