    如果啓用此選項，正在跟隨的使用者不受過濾條件限制。
  filter_out_vertical_videos: 過濾直式影片（僅在 app 推薦模式下有效）
  filter_by_view_count: 按觀看次數篩選
  filter_by_view_count_desc: 篩選掉觀看次數少於您設定的影片。
  filter_by_view_count_unit: 次
  filter_by_duration: 按影片長度篩選
  filter_by_duration_desc: 篩選掉時長少於您設定的影片。
  filter_by_duration_unit: 秒
  filter_item_already_exist: 這個篩選項目已經存在！
  filter_by_title: 按標題篩選
  filter_by_title_desc: |-
    按標題篩選掉包含您設定的字串的影片（不區分大小寫），或使用正規表示式，如 <code>/abc&#124;\d+/</code>，用 <code>/</code> 包裡。
    <br/>
    在下面的表格中，您可以按 <kbd>Enter</kbd> 鍵新增新的篩選條件或確認變更。
    按 <kbd>Esc</kbd> 鍵取消變更。
    按兩下欄位以編輯目前欄位。
  filter_by_user: 按使用者篩選
  filter_by_user_desc: |-
    篩選掉包含您設定的使用者名稱（全名，不區分大小寫）或 MID 所上傳的影片，或使用正規表示式，如 <code>/abc&#124;\d+/</code>，用 <code>/</code> 包裡。
    <br/>
    在下面的表格中，您可以按 <kbd>Enter</kbd> 鍵建立新的篩選條件或確認變更。
    按 <kbd>Esc</kbd> 鍵取消變更。
    按兩下欄位以編輯目前欄位。
